[input_adb_lookup(1)]
args = lookup
definition = inputlookup append=true $lookup$ | eval source_lookup=coalesce(source_lookup, "$lookup$")
iseval = 0

[output_adb_lookup(1)]
args = lookup
definition = eval source_lookup="$lookup$" | outputlookup $lookup$
iseval = 0

[normalize_trim(1)]
args = field
definition = eval $field$=mvmap($field$, trim($field$))
iseval = 0

[normalize_mac(1)]
args = mac
definition = eval $mac$=mvmap($mac$, replace(lower(trim($mac$)), "^([0-9a-f]{2})[^0-9a-f]?([0-9a-f]{2})[^0-9a-f]?([0-9a-f]{2})[^0-9a-f]?([0-9a-f]{2})[^0-9a-f]?([0-9a-f]{2})[^0-9a-f]?([0-9a-f]{2})$", "\\1:\\2:\\3:\\4:\\5:\\6"))
iseval = 0

[normalize_ip(1)]
args = ip
definition = eval $ip$=mvmap($ip$, if(match(trim($ip$), "^\\d{1,3}(\\.\\d{1,3}){3}$"), replace(trim($ip$), "(^|\\.)0+(\\d)", "\\1\\2"), lower(trim($ip$))))
iseval = 0

[normalize_hostname(1)]
args = host
definition = eval $host$=mvmap($host$, if(match(trim($host$), "^\\d{1,3}(\\.\\d{1,3}){3}$"), trim($host$), lower(replace(trim($host$), "\\..*$", ""))))
iseval = 0

[normalize_fqdn(1)]
args = fqdn
definition = eval $fqdn$=mvmap($fqdn$, lower(replace(trim($fqdn$), "\\.$", "")))
iseval = 0

[normalize_user(1)]
args = user
definition = eval $user$=mvmap($user$, lower(replace(replace(trim($user$), "^.*\\\\", ""), "@.*$", "")))
iseval = 0

[normalize_email(1)]
args = email
definition = eval $email$=mvmap($email$, lower(trim($email$)))
iseval = 0

[normalize_os(1)]
args = os
definition = eval $os$=mvmap($os$, case(\
    match($os$, "(?i:ios|iphone)"), "ios",\
    match($os$, "(?i:ipad)"), "ipados",\
    match($os$, "(?i:mac|os ?x|darwin|catalina|big sur|monterey|ventura|sonoma|sequoia|tahoe)"), "macos",\
    match($os$, "(?i:android)"), "android",\
    match($os$, "(?i:aix)"), "aix",\
    match($os$, "(?i:centos)"), "centos",\
    match($os$, "(?i:ubuntu)"), "ubuntu",\
    match($os$, "(?i:debian)"), "debian",\
    match($os$, "(?i:red.?hat|rhel)"), "redhat",\
    match($os$, "(?i:suse)"), "suse_linux",\
    match($os$, "(?i:linux)"), "linux",\
    match($os$, "(?i:windows\s?server|windows(\s?server)?\d\d\d\d)"), "windows_server",\
    match($os$, "(?i:windows)"), "windows",\
    match($os$, "(?i:esxi)"), "esxi",\
    match($os$, "(?i:f5)"), "f5",\
    match($os$, "(?i:asa)"), "asa",\
    true(), $os$\
))
iseval = 0

# --- Enrichment: add the merged asset to any event ---------------------------------------------------
# Usage:  index=... | `adb_enrich(src_ip)`           adds asset_id, asset_source, asset_<field> ... for the asset that has
#                                                       that value as one of its keys (matching is lowercase)
#         ... | `adb_enrich_mac(src_mac)`             normalizes the value like the field normalizer before matching
#         ... | `adb_enrich_scoped(src_ip, site)`     for keys marked Scoped: looks up "<site>|<value>"
# The columns come from `adb_enrich_outputs`, which the Configure page keeps in line with the configured fields.

[adb_enrich_outputs]
definition = _key AS asset_id, source AS asset_source, source_lookup AS asset_source_lookup, last_seen AS asset_last_seen
iseval = 0

[adb_enrich_with(2)]
args = key,lookup
definition = eval adb_lookup_key=lower($key$) | lookup $lookup$ asset AS adb_lookup_key OUTPUTNEW `adb_enrich_outputs` | fields - adb_lookup_key
iseval = 0

[adb_enrich(1)]
args = key
definition = `adb_enrich_with($key$, assetdb)`
iseval = 0

[adb_enrich_scoped(2)]
args = key,scope
definition = eval adb_lookup_key=lower($scope$) . "|" . lower($key$) | lookup assetdb asset AS adb_lookup_key OUTPUTNEW `adb_enrich_outputs` | fields - adb_lookup_key
iseval = 0

[adb_enrich_mac(1)]
args = key
definition = eval adb_nk=$key$ | `normalize_mac(adb_nk)` | `adb_enrich_with(adb_nk, assetdb)` | fields - adb_nk
iseval = 0

[adb_enrich_ip(1)]
args = key
definition = eval adb_nk=$key$ | `normalize_ip(adb_nk)` | `adb_enrich_with(adb_nk, assetdb)` | fields - adb_nk
iseval = 0

[adb_enrich_host(1)]
args = key
definition = eval adb_nk=$key$ | `normalize_hostname(adb_nk)` | `adb_enrich_with(adb_nk, assetdb)` | fields - adb_nk
iseval = 0
