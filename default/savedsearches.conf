[assetdb-lookupgen]
display.general.timeRangePicker.show = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search
alert.track = 0
cron_schedule = 0 0 * * *
schedule_window = 60
enableSched = 1
search = | makeresults

[assetdb-run-alert]
description = Fires when the latest merge run was blocked by the safety check (too few assets) or produced no assets. Disabled by default: enable it, choose a schedule and add an alert action.
search = | inputlookup assetdb_runs | sort 0 -run_time | head 1 | where status!="ok" | eval message="Latest AssetDB run: ".status.", assets out ".assets_out.", previous ".coalesce(assets_prev, "none")
cron_schedule = 15 * * * *
enableSched = 0
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
dispatch.earliest_time = -5m
dispatch.latest_time = now
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

# --- Source lookup templates ----------------------------------------------------------------------------------
# Disabled starting points that build a source lookup in the field names the CIM presets use. Enable one, run it
# once (it creates the lookup file), then add that lookup on the Configure page. Adapt the search to your data.
# Template version 1.

[assetdb-src-splunk-hosts]
description = Template (version 1): every host that sends data to this Splunk deployment. Needs no add-on. Creates assetdb_src_splunk_hosts.csv: add it as an Authoritative source. Only the host name is known, so pair it with richer sources.
search = | metadata type=hosts index=* | eval nt_host=host, _time=lastTime | table _time nt_host | `output_adb_lookup(assetdb_src_splunk_hosts.csv)`
cron_schedule = 30 1 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-dhcp-cim]
description = Template (version 1): IP address, MAC address and host name from DHCP events mapped to the CIM Network Sessions data model (Splunk Common Information Model add-on and a DHCP add-on, e.g. for Windows or ISC DHCP). Creates assetdb_src_dhcp.csv: add it as an Authoritative source. Keep Max Age short (e.g. 7d) because leases change.
search = | tstats latest(_time) as _time from datamodel=Network_Sessions where nodename=All_Sessions.DHCP by All_Sessions.src_ip, All_Sessions.src_mac, All_Sessions.src_host | rename All_Sessions.src_ip as ip, All_Sessions.src_mac as mac, All_Sessions.src_host as nt_host | `output_adb_lookup(assetdb_src_dhcp.csv)`
cron_schedule = 45 1 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-vulnerabilities-cim]
description = Template (version 1): vulnerability counts and the highest CVSS score per host from the CIM Vulnerabilities data model (Common Information Model add-on and a scanner add-on such as Tenable or Qualys). Creates assetdb_src_vulnerabilities.csv: add it as an Enrich only source, so a scanner never creates assets or links them.
search = | tstats latest(_time) as _time, dc(Vulnerabilities.signature) as vuln_signatures, max(Vulnerabilities.cvss) as max_cvss from datamodel=Vulnerabilities by Vulnerabilities.dest | rename Vulnerabilities.dest as dest | eval ip=if(match(dest, "^\d{1,3}(\.\d{1,3}){3}$"), dest, null()), nt_host=if(isnull(ip), dest, null()) | fields - dest | `output_adb_lookup(assetdb_src_vulnerabilities.csv)`
cron_schedule = 0 2 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-ad-computers]
description = Template (version 2, adapt before use, not tested here): enabled computer accounts from Active Directory with the Splunk Supporting Add-on for Active Directory (SA-ldapsearch, Splunkbase 1151; the ldapsearch command). Edit the domain name. It reads cn, dNSHostName, operatingSystem, operatingSystemVersion, managedBy (a distinguished name: the CN is kept as the owner), whenChanged and lastLogonTimestamp (the time of the last logon, replicated every 9-14 days). The time is the last logon when ldapsearch returns it in the format %Y-%m-%d %H:%M:%S, else whenChanged (%Y%m%d%H%M%S.0Z): check how your version prints them. Active Directory holds no IP or MAC address, so these computers match other sources by host name or DNS name only. Creates assetdb_src_ad_computers.csv: add it as an Authoritative source.
search = | ldapsearch domain="default" search="(&(objectCategory=computer)(!(userAccountControl:1.2.840.113556.1.4.803:=2)))" attrs="cn,dNSHostName,operatingSystem,operatingSystemVersion,managedBy,whenChanged,lastLogonTimestamp" | eval nt_host=lower(cn), dns=lower(dNSHostName), os=trim(coalesce(operatingSystem, "") . " " . coalesce(operatingSystemVersion, "")), owner=replace(managedBy, "^CN=([^,]+),.*", "\1"), _time=coalesce(strptime(lastLogonTimestamp, "%Y-%m-%d %H:%M:%S"), strptime(whenChanged, "%Y%m%d%H%M%S.0Z")) | table _time nt_host dns os owner | `output_adb_lookup(assetdb_src_ad_computers.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 15 3 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-crowdstrike-devices]
description = Template (version 2): hosts from the CrowdStrike Falcon Devices Technical Add-on (sourcetype crowdstrike:device:json). The add-on stores the whole Hosts API record under the prefix falcon_device. and adds a ta_data. block with the timestamp; its own macro cs_fd_get_index names the index. Fields read: falcon_device.device_id (the Falcon agent ID, the key of the grouping), hostname, local_ip, mac_address, machine_domain, platform_name, os_version. The external IP is not used: it is a shared (NAT) address. The add-on's own aliases (mac, os, serial, src_ip) confirm these field names. Creates assetdb_src_crowdstrike.csv: add it as an Authoritative source and consider adding cs_device_id as a field.
search = `cs_fd_get_index` sourcetype="crowdstrike:device:json" | stats latest(_time) as _time, latest(falcon_device.hostname) as hostname, latest(falcon_device.local_ip) as ip, latest(falcon_device.mac_address) as mac, latest(falcon_device.machine_domain) as machine_domain, latest(falcon_device.platform_name) as platform_name, latest(falcon_device.os_version) as os_version by falcon_device.device_id | rename falcon_device.device_id as cs_device_id | eval nt_host=lower(mvindex(split(hostname, "."), 0)), dns=if(isnotnull(machine_domain) AND isnotnull(hostname) AND NOT match(hostname, "\."), lower(hostname . "." . machine_domain), if(match(hostname, "\."), lower(hostname), null())), os=if(isnotnull(os_version) AND like(lower(os_version), "%" . lower(platform_name) . "%"), os_version, trim(coalesce(platform_name, "") . " " . coalesce(os_version, ""))) | table _time ip mac nt_host dns os cs_device_id | `output_adb_lookup(assetdb_src_crowdstrike.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 20 3 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-defender-machines]
description = Template (version 1): devices from Microsoft Defender for Endpoint through the Splunk Add-on for Microsoft Security (sourcetype ms:defender:machines, the List Machines API). Field names are the Machine resource properties documented by Microsoft: id, computerDnsName, lastIpAddress, osPlatform, version, ipAddresses (with ipAddress and macAddress), rbacGroupName, machineTags. Creates assetdb_src_defender.csv: add it as an Authoritative source and consider adding defender_id as a field.
search = index=* sourcetype="ms:defender:machines" | stats latest(_time) as _time, latest(computerDnsName) as computerDnsName, latest(lastIpAddress) as lastIpAddress, latest(osPlatform) as osPlatform, latest(version) as version, values(ipAddresses{}.macAddress) as mac, values(ipAddresses{}.ipAddress) as ip_list by id | eval dns=lower(computerDnsName), nt_host=lower(mvindex(split(computerDnsName, "."), 0)), ip=mvdedup(mvappend(lastIpAddress, ip_list)), os=trim(coalesce(osPlatform, "") . " " . coalesce(version, "")), defender_id=id, ip=mvjoin(ip, "|"), mac=mvjoin(mac, "|") | table _time ip mac nt_host dns os defender_id | `output_adb_lookup(assetdb_src_defender.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 25 3 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-tenable-assets]
description = Template (version 2): assets from Tenable Vulnerability Management through the Tenable Add-On for Splunk (sourcetype tenable:io:assets). The add-on reads the asset export with KV_MODE json and aliases the arrays (ipv4s, mac_addresses, hostnames, fqdns, netbios_names, agent_names, operating_systems) that this search reads, plus the per-interface copies under network_interfaces{}. Assets Tenable has terminated or deleted are left out. Creates assetdb_src_tenable.csv: add it as an Authoritative source (or Enrich only if another source should own the inventory) and consider adding tenable_id as a field.
search = index=* sourcetype="tenable:io:assets" | eval ip_all=mvappend('ipv4s{}', 'network_interfaces{}.ipv4s{}'), mac_all=mvappend('mac_addresses{}', 'network_interfaces{}.mac_addresses{}'), fqdn_all=mvappend('fqdns{}', 'network_interfaces{}.fqdns{}'), host_all=mvappend('hostnames{}', 'netbios_names{}', 'agent_names{}'), seen=coalesce(strptime(last_seen, "%Y-%m-%dT%H:%M:%S.%3QZ"), strptime(last_seen, "%Y-%m-%dT%H:%M:%SZ"), _time) | where isnull(terminated_at) AND isnull(deleted_at) | stats max(seen) as _time, values(ip_all) as ip, values(mac_all) as mac, values(host_all) as host_list, values(fqdn_all) as dns, values(operating_systems{}) as os by id | eval host_list=mvappend(host_list, dns), nt_host=mvdedup(mvmap(host_list, if(match(host_list, "^\d{1,3}(\.\d{1,3}){3}$"), null(), lower(mvindex(split(host_list, "."), 0))))), dns=lower(dns), tenable_id=id | foreach ip mac nt_host dns os [eval <<FIELD>>=mvjoin(mvdedup(<<FIELD>>), "|")] | table _time ip mac nt_host dns os tenable_id | `output_adb_lookup(assetdb_src_tenable.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 35 3 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-servicenow-cmdb]
description = Template (version 1): servers and virtual machines of the ServiceNow CMDB through the Splunk Add-on for ServiceNow (inputs cmdb_ci_server and cmdb_ci_vm, sourcetypes snow:cmdb_ci_server and snow:cmdb_ci_vm). Field names are the CI columns that the add-on lists in its own lookups: sys_id, name, host_name, fqdn or fully_qualified_domain_name, dns_domain, ip_address, mac_address, os_version, assigned_to_name, sys_class_name, install_status, sys_updated_on. Retired and absent CIs are left out. A CMDB is only as good as its discovery: pair it with a source that sees the network. To include every CI class add sourcetype snow:cmdb_ci_list, which also holds services and network gear. Creates assetdb_src_servicenow.csv: add it as an Authoritative source and consider adding snow_sys_id as a field.
search = index=* (sourcetype="snow:cmdb_ci_server" OR sourcetype="snow:cmdb_ci_vm") | where isnull(install_status) OR NOT in(lower(install_status), "7", "retired", "8", "absent") | eval host=coalesce(host_name, name), fq=coalesce(fqdn, fully_qualified_domain_name), os_all=coalesce(os, os_version), seen=coalesce(strptime(sys_updated_on, "%Y-%m-%d %H:%M:%S"), _time) | stats max(seen) as _time, latest(host) as host, latest(fq) as fq, latest(dns_domain) as dns_domain, latest(ip_address) as ip, latest(mac_address) as mac, latest(os_all) as os, latest(assigned_to_name) as owner, latest(sys_class_name) as category by sys_id | eval nt_host=if(match(host, "^\d{1,3}(\.\d{1,3}){3}$"), null(), lower(mvindex(split(host, "."), 0))), dns=lower(coalesce(fq, if(isnotnull(host) AND isnotnull(dns_domain) AND NOT match(host, "\."), host . "." . dns_domain, null()))), snow_sys_id=sys_id | table _time ip mac nt_host dns os owner category snow_sys_id | `output_adb_lookup(assetdb_src_servicenow.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 40 3 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-qualys-vmdr-hosts]
description = Template (version 1, adapt before use): hosts that Qualys VMDR scanned, from the per-host results of the Qualys Universal Technology Add-on (sourcetype qualys:vmdr:scan_host_results). The add-on writes each result of a scan report as an event with its keys in upper case (IP, DNS, NETBIOS, OS, QID, SCAN_REF); the add-on does not list the columns, so they are taken from the Qualys scan report and both spellings are read. Run | fieldsummary on your data and adjust. One host appears once per finding, so the search groups by IP. Creates assetdb_src_qualys.csv: add it as an Enrich only source, so a scanner never creates assets by itself.
search = index=* sourcetype="qualys:vmdr:scan_host_results" | eval ip_addr=coalesce(IP, ip), dns_name=coalesce(FQDN, DNS, dns), netbios=coalesce(NETBIOS, netbios), os_name=coalesce(OS, os) | where isnotnull(ip_addr) | stats latest(_time) as _time, latest(dns_name) as dns_name, latest(netbios) as netbios, latest(os_name) as os by ip_addr | eval ip=ip_addr, dns=if(match(dns_name, "\."), lower(dns_name), null()), nt_host=lower(mvindex(split(coalesce(netbios, dns_name), "."), 0)) | table _time ip nt_host dns os | `output_adb_lookup(assetdb_src_qualys.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 45 3 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-rapid7-insightvm]
description = Template (version 1): assets from Rapid7 InsightVM through the Rapid7 InsightVM Technology Add-On (sourcetype rapid7:insightvm:asset, one event per asset, last_scan_end as the time of the scan). Field names are those the add-on reads from the InsightVM asset: id, ip, mac, host_name, os_system_name (the add-on aliases it to vendor_product), os_version, os_description, last_scan_end. The add-on imports only assets scanned since the last import, so use a Max Age on the source that fits your scan cycle. Creates assetdb_src_rapid7.csv: add it as an Authoritative source (or Enrich only if another source owns the inventory) and consider adding insightvm_id as a field.
search = index=* sourcetype="rapid7:insightvm:asset" | eval seen=coalesce(strptime(last_scan_end, "%Y-%m-%dT%H:%M:%S.%3QZ"), strptime(last_scan_end, "%Y-%m-%dT%H:%M:%SZ"), _time) | stats max(seen) as _time, latest(ip) as ip, latest(mac) as mac, latest(host_name) as host_name, latest(os_description) as os_description, latest(os_system_name) as os_system_name, latest(os_version) as os_version by id | eval nt_host=if(match(host_name, "^\d{1,3}(\.\d{1,3}){3}$"), null(), lower(mvindex(split(host_name, "."), 0))), dns=if(match(host_name, "\.") AND NOT match(host_name, "^\d{1,3}(\.\d{1,3}){3}$"), lower(host_name), null()), os=coalesce(os_description, trim(coalesce(os_system_name, "") . " " . coalesce(os_version, ""))), insightvm_id=id | table _time ip mac nt_host dns os insightvm_id | `output_adb_lookup(assetdb_src_rapid7.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 50 3 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-armis-devices]
description = Template (version 1): devices Armis discovered, through the Armis Add-On for Splunk (sourcetype armis:device, one event per device). It uses the add-on's own macro armis_index. Field names are the ones the add-on aliases: id, name, ipAddress, ipv6, macAddress (Armis may hold several, separated by commas), operatingSystem, operatingSystemVersion, type, manufacturer, model, site.name, serialNumber{}.value. The Armis name is only used as a host name when it looks like one (letters, digits, dashes), because it is often a model or an address. Creates assetdb_src_armis.csv: add it as an Authoritative source (it sees devices no agent does) and consider adding armis_id as a field.
search = `armis_index` sourcetype="armis:device" | stats latest(_time) as _time, latest(name) as name, values(ipAddress) as ip_raw, values(ipv6) as ip6_raw, values(macAddress) as mac_raw, latest(operatingSystem) as os_name, latest(operatingSystemVersion) as os_version, latest(type) as category by id | eval ip=mvappend(split(ip_raw, ","), split(ip6_raw, ",")), mac=split(mac_raw, ",") | eval ip=mvdedup(mvmap(ip, trim(ip))), mac=mvdedup(mvmap(mac, trim(mac))) | eval nt_host=if(match(name, "^[A-Za-z0-9_-]+(\.[A-Za-z0-9_.-]+)?$") AND NOT match(name, "^\d{1,3}(\.\d{1,3}){3}$"), lower(mvindex(split(name, "."), 0)), null()), os=trim(coalesce(os_name, "") . " " . coalesce(os_version, "")), armis_id=id | foreach ip mac [eval <<FIELD>>=mvjoin(<<FIELD>>, "|")] | table _time ip mac nt_host os category armis_id | `output_adb_lookup(assetdb_src_armis.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 55 3 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-axonius-devices]
description = Template (version 1, adapt before use): devices from an Axonius saved query, through the Axonius Add-On for Splunk (sourcetype axonius_saved_query, entity type devices). The columns of the event are the columns of the saved query, so choose hostname, network_interfaces.ips, network_interfaces.mac, os.type or os.distribution, last_seen and internal_axon_id in it. The add-on writes the long names (specific_data.data.hostname) unless Shorten Field Names is on; both are read. The device ID Axonius gives every aggregated asset (internal_axon_id) is the key of the grouping. Creates assetdb_src_axonius.csv: add it as an Authoritative source and consider adding axonius_id as a field. Axonius already merges its adapters, so give it a source of its own rather than also adding the tools it aggregates.
search = index=* sourcetype="axonius_saved_query" | eval axid=coalesce(internal_axon_id, 'specific_data.data.internal_axon_id'), host=coalesce(hostname, 'specific_data.data.hostname'), ip_all=mvappend('network_interfaces.ips{}', 'specific_data.data.network_interfaces.ips{}'), mac_all=mvappend('network_interfaces.mac{}', 'specific_data.data.network_interfaces.mac{}'), os_all=coalesce('os.distribution', 'os.type', 'specific_data.data.os.distribution', 'specific_data.data.os.type') | where isnotnull(axid) | stats latest(_time) as _time, latest(host) as host, values(ip_all) as ip, values(mac_all) as mac, latest(os_all) as os by axid | eval host=mvindex(host, 0), nt_host=if(match(host, "^\d{1,3}(\.\d{1,3}){3}$"), null(), lower(mvindex(split(host, "."), 0))), dns=if(match(host, "\.") AND NOT match(host, "^\d{1,3}(\.\d{1,3}){3}$"), lower(host), null()), axonius_id=axid | foreach ip mac [eval <<FIELD>>=mvjoin(mvdedup(<<FIELD>>), "|")] | table _time ip mac nt_host dns os axonius_id | `output_adb_lookup(assetdb_src_axonius.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 0 4 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-lansweeper-assets]
description = Template (version 1): assets from Lansweeper (cloud or on premises) through the Lansweeper Add-on for Splunk (sourcetypes lansweeper:asset, lansweeper:asset:v2 and lansweeper:asset:onprem). It reads the simple names the add-on's props.conf creates for all three layouts: AssetID, AssetName, FQDN, DNSName, IPAddress, Mac, OS, AssetTypename (the add-on computes OS from the operating system caption, release or version). Creates assetdb_src_lansweeper.csv: add it as an Authoritative source and consider adding lansweeper_id as a field.
search = index=* sourcetype="lansweeper:asset*" | stats latest(_time) as _time, latest(AssetName) as asset_name, latest(FQDN) as fqdn, latest(DNSName) as dns_name, latest(IPAddress) as ip, latest(Mac) as mac, latest(OS) as os, latest(AssetTypename) as category by AssetID | eval dns=lower(coalesce(fqdn, if(match(dns_name, "\."), dns_name, null()))), nt_host=if(match(asset_name, "^\d{1,3}(\.\d{1,3}){3}$"), null(), lower(mvindex(split(asset_name, "."), 0))), lansweeper_id=AssetID | table _time ip mac nt_host dns os category lansweeper_id | `output_adb_lookup(assetdb_src_lansweeper.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 5 4 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-jamf-computers]
description = Template (version 1): Mac computers from Jamf Pro through the Jamf Pro Add-on for Splunk (Computers input, which writes each inventory section as its own event). The sourcetypes jssUapiComputer:computerGeneral, :computerHardware and :operatingSystem carry the sections general, hardware and operating system of the Jamf Pro computer inventory (keys computerGeneral.*, computerHardware.*, computerOS.*), and every event has computer_meta.id, the Jamf computer ID that joins them. Fields read: computerGeneral.name, lastReportedIp (the address the computer reports; lastIpAddress is the one Jamf Pro sees, often a shared public address, so it is not used), reportDate; computerHardware.macAddress, altMacAddress; computerOS.name, version. Creates assetdb_src_jamf.csv: add it as an Authoritative source and consider adding jamf_id as a field.
search = index=* (sourcetype="jssUapiComputer:computerGeneral" OR sourcetype="jssUapiComputer:computerHardware" OR sourcetype="jssUapiComputer:operatingSystem") | eval jid='computer_meta.id', gname='computerGeneral.name', gip='computerGeneral.lastReportedIp', mac1='computerHardware.macAddress', mac2='computerHardware.altMacAddress', osn='computerOS.name', osv='computerOS.version', seen=coalesce(strptime('computerGeneral.reportDate', "%Y-%m-%dT%H:%M:%S.%3QZ"), strptime('computerGeneral.reportDate', "%Y-%m-%dT%H:%M:%SZ"), _time) | where isnotnull(jid) | stats max(seen) as _time, latest(gname) as gname, latest(gip) as gip, latest(mac1) as mac1, latest(mac2) as mac2, latest(osn) as osn, latest(osv) as osv by jid | eval ip=gip, mac=mvjoin(mvdedup(mvappend(mac1, mac2)), "|"), nt_host=lower(mvindex(split(gname, "."), 0)), os=trim(coalesce(osn, "") . " " . coalesce(osv, "")), jamf_id=jid | table _time ip mac nt_host os jamf_id | `output_adb_lookup(assetdb_src_jamf.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 10 4 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-aws-ec2-instances]
description = Template (version 1): EC2 instances from the Splunk Add-on for AWS (Description input, source ending in :ec2_instances, sourcetype aws:description). Field names are those the add-on's props.conf uses for the same events: id (the instance ID), private_ip_address, private_dns_name, tags.Name, platform, state, instance_type, vpc_id, owner_id. Terminated instances are left out. The public address (ip_address) is not used: it changes when an instance restarts. The Name tag is used as the host name when there is one, so the result is only as good as your tagging. Creates assetdb_src_aws_ec2.csv: add it as an Authoritative source and consider adding aws_instance_id as a field. Use a short Max Age: instances come and go.
search = index=* sourcetype="aws:description" source="*:ec2_instances" | where isnull(state) OR NOT in(lower(state), "terminated", "shutting-down") | stats latest(_time) as _time, latest(private_ip_address) as ip, latest(private_dns_name) as dns, latest(tags.Name) as name_tag, latest(platform) as platform by id | eval nt_host=lower(mvindex(split(coalesce(name_tag, dns), "."), 0)), dns=lower(dns), os=if(lower(platform)="windows", "Windows", "Linux/UNIX"), aws_instance_id=id | table _time ip nt_host dns os aws_instance_id | `output_adb_lookup(assetdb_src_aws_ec2.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 15 4 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
