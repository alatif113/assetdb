[assetdb-src-trellix-epo-systems]
description = Template (version 1, adapt before use): systems Trellix ePO manages, from the Trellix ePO All in one add-on (Splunkbase 8351; sourcetype trellix_epo:host_status, one event per system). Field names follow the add-on's props.conf aliases and its own mapping of the ePO system properties (computerName, ipAddress, macAddress, dnsName, osType, osVersion, domainName, lastCommunication); operatingSystem is used when it is there. The add-on's index is main by default: narrow the search to the index you chose. The older Trellix MVision EPO add-on (7022) is a log forwarder, not an inventory. Creates assetdb_src_trellix.csv: add it as an Authoritative source.
search = index=* sourcetype="trellix_epo:host_status" | stats latest(_time) as _time, values(ipAddress) as ip, values(macAddress) as mac, latest(dnsName) as dns_name, latest(operatingSystem) as os_name, latest(osType) as os_type, latest(osVersion) as os_ver by computerName | eval ip=split(mvjoin(ip, ","), ","), mac=split(mvjoin(mac, ","), ",") | eval ip=mvdedup(mvmap(ip, trim(ip))), mac=mvdedup(mvmap(mac, trim(mac))), nt_host=lower(mvindex(split(computerName, "."), 0)), dns=if(match(dns_name, "\."), lower(dns_name), null()), os=coalesce(os_name, trim(coalesce(os_type, "") . " " . coalesce(os_ver, ""))) | foreach ip mac [eval <<FIELD>>=mvjoin(<<FIELD>>, "|")] | table _time ip mac nt_host dns os | `output_adb_lookup(assetdb_src_trellix.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 0 5 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-device42-devices]
description = Template (version 1, adapt before use, not tested against Device42): devices from the Erasmith Add-on for Device42 (Splunkbase 7889; sourcetype device42_json, index device42). The add-on prints the response of one Device42 URL as it is, with no field extractions, so this assumes that URL is the devices API (/api/1.0/devices/all/, which answers {"Devices": [...]}) and reads device_id, name, os, type, serial_no and ip_addresses with ip and mac. Another URL, or a DOQL query, needs other paths. spath reads the first 5000 characters of an event by default (extraction_cutoff in limits.conf), so a large answer must be split first. Creates assetdb_src_device42.csv: add it as an Authoritative source and consider adding device42_id as a field.
search = index=device42 sourcetype="device42_json" | spath path=Devices{} output=dev | mvexpand dev | spath input=dev | rename "ip_addresses{}.ip" as ip, "ip_addresses{}.mac" as mac | stats latest(_time) as _time, latest(name) as name, values(ip) as ip, values(mac) as mac, latest(os) as os, latest(type) as category by device_id | eval device42_id=device_id, nt_host=lower(mvindex(split(name, "."), 0)), dns=if(match(name, "\."), lower(name), null()) | foreach ip mac [eval <<FIELD>>=lower(mvjoin(<<FIELD>>, "|"))] | table _time ip mac nt_host dns os category device42_id | `output_adb_lookup(assetdb_src_device42.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 10 5 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-workspace-one-devices]
description = Template (version 1, weak fit): devices Workspace ONE UEM (AirWatch) reported a location for. The only Splunkbase add-on for it, the Omnissa Workspace ONE UEM (AirWatch) Device Location (GPS) Add-on (10147; sourcetype airwatch:gps), collects device locations, not an inventory, and its events carry no IP or MAC address: only DeviceId, SerialNumber, DeviceFriendlyName, UserName and UserEmailAddress. So this lists devices by serial number, name and user: it only helps if your key fields include one of them (add serial as a key field in Configure). It does not need to be an Authoritative source. Creates assetdb_src_workspace_one.csv.
search = index=* sourcetype="airwatch:gps" | stats latest(_time) as _time, latest(DeviceFriendlyName) as name, latest(SerialNumber) as serial, latest(UserEmailAddress) as owner by DeviceId | eval workspace_one_id=DeviceId, nt_host=if(match(name, "^[A-Za-z0-9_-]+(\.[A-Za-z0-9_.-]+)?$") AND NOT match(name, "^\d{1,3}(\.\d{1,3}){3}$"), lower(mvindex(split(name, "."), 0)), null()) | table _time nt_host serial owner workspace_one_id | `output_adb_lookup(assetdb_src_workspace_one.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 20 5 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-cisco-secure-endpoint-computers]
description = Template (version 1, adapt before use): computers from the Cisco Secure Endpoint (AMP) Events and Audit Logs add-on (Splunkbase 10276). Its computers input writes one snapshot per computer per run into sourcetype cisco:se with EndpointDataType="computers"; the fields are the Secure Endpoint API's /v1/computers record as JSON (connector_guid, hostname, active, internal_ips, network_addresses with ip and mac, operating_system), which the add-on passes through, so check the names in your events. Inactive computers are left out. The external IP is not used: it is a shared (NAT) address. Creates assetdb_src_cisco_secure_endpoint.csv: add it as an Authoritative source and consider adding cisco_se_id as a field.
search = index=* sourcetype="cisco:se" EndpointDataType="computers" | rename "internal_ips{}" as ip_a, "network_addresses{}.ip" as ip_b, "network_addresses{}.mac" as mac | stats latest(_time) as _time, latest(hostname) as hostname, latest(active) as active, latest(operating_system) as os, values(ip_a) as ip_a, values(ip_b) as ip_b, values(mac) as mac by connector_guid | where isnull(active) OR lower(active)!="false" | eval cisco_se_id=connector_guid, ip=mvdedup(mvappend(ip_a, ip_b)), nt_host=lower(mvindex(split(hostname, "."), 0)), dns=if(match(hostname, "\."), lower(hostname), null()) | foreach ip mac [eval <<FIELD>>=lower(mvjoin(<<FIELD>>, "|"))] | table _time ip mac nt_host dns os cisco_se_id | `output_adb_lookup(assetdb_src_cisco_secure_endpoint.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 30 5 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search

[assetdb-src-symantec-endpoint-protection]
description = Template (version 1, weak fit, adapt before use): computers seen in Symantec Endpoint Protection client logs, from the Splunk Add-on for Symantec Endpoint Protection (Splunkbase 2772). The add-on collects the logs of the Symantec Endpoint Protection Manager and has no inventory, so this lists the computers that appear in the agent, risk and scan logs (sourcetypes symantec:ep:agent:*, symantec:ep:risk:* and symantec:ep:scan:*): a computer that logged nothing in the period is missing. Field names are the ones the add-on aliases (Host_Name, Computer_Name, IP_Address, Source_Computer_IP, Domain_Name). Use it to enrich, not as the authority. Creates assetdb_src_symantec.csv.
search = index=* (sourcetype="symantec:ep:agent:*" OR sourcetype="symantec:ep:risk:*" OR sourcetype="symantec:ep:scan:*") | eval name=coalesce(Host_Name, Computer_Name), addr=coalesce(IP_Address, Source_Computer_IP) | where isnotnull(name) | stats latest(_time) as _time, latest(addr) as ip, latest(Domain_Name) as domain by name | eval nt_host=lower(mvindex(split(name, "."), 0)), dns=if(match(name, "\."), lower(name), null()) | table _time ip nt_host dns | `output_adb_lookup(assetdb_src_symantec.csv)`
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 40 5 * * *
enableSched = 0
disabled = 1
request.ui_dispatch_app = assetdb
request.ui_dispatch_view = search
