[input_adb_lookup(1)]
args = lookup
definition = inputlookup append=true $lookup$ | eval adb_src=coalesce(adb_src, "$lookup$"), source_lookup=adb_src
iseval = 0

[output_adb_lookup(1)]
args = lookup
definition = eval source_lookup="$lookup$" | outputlookup $lookup$
iseval = 0

[normalize_trim(1)]
args = field
definition = eval $field$=mvmap($field$, trim($field$))
iseval = 0

[normalize_mac(1)]
args = mac
definition = eval $mac$=mvmap($mac$, replace(lower(trim($mac$)), "^([0-9a-f]{2})[^0-9a-f]?([0-9a-f]{2})[^0-9a-f]?([0-9a-f]{2})[^0-9a-f]?([0-9a-f]{2})[^0-9a-f]?([0-9a-f]{2})[^0-9a-f]?([0-9a-f]{2})$", "\\1:\\2:\\3:\\4:\\5:\\6"))
iseval = 0

[normalize_ip(1)]
args = ip
definition = eval $ip$=mvmap($ip$, if(match(trim($ip$), "^\\d{1,3}(\\.\\d{1,3}){3}$"), replace(trim($ip$), "(^|\\.)0+(\\d)", "\\1\\2"), lower(trim($ip$))))
iseval = 0

[normalize_hostname(1)]
args = host
definition = eval $host$=mvmap($host$, if(match(trim($host$), "^\\d{1,3}(\\.\\d{1,3}){3}$"), trim($host$), lower(replace(trim($host$), "\\..*$", ""))))
iseval = 0

[normalize_fqdn(1)]
args = fqdn
definition = eval $fqdn$=mvmap($fqdn$, lower(replace(trim($fqdn$), "\\.$", "")))
iseval = 0

[normalize_user(1)]
args = user
definition = eval $user$=mvmap($user$, lower(replace(replace(trim($user$), "^.*\\\\", ""), "@.*$", "")))
iseval = 0

[normalize_email(1)]
args = email
definition = eval $email$=mvmap($email$, lower(trim($email$)))
iseval = 0

[normalize_os(1)]
args = os
definition = eval $os$=mvmap($os$, case(\
    match($os$, "(?i:ios|iphone)"), "ios",\
    match($os$, "(?i:ipad)"), "ipados",\
    match($os$, "(?i:mac|os ?x|darwin|catalina|big sur|monterey|ventura|sonoma|sequoia|tahoe)"), "macos",\
    match($os$, "(?i:android)"), "android",\
    match($os$, "(?i:aix)"), "aix",\
    match($os$, "(?i:centos)"), "centos",\
    match($os$, "(?i:ubuntu)"), "ubuntu",\
    match($os$, "(?i:debian)"), "debian",\
    match($os$, "(?i:red.?hat|rhel)"), "redhat",\
    match($os$, "(?i:suse)"), "suse_linux",\
    match($os$, "(?i:linux)"), "linux",\
    match($os$, "(?i:windows\s?server|windows(\s?server)?\d\d\d\d)"), "windows_server",\
    match($os$, "(?i:windows)"), "windows",\
    match($os$, "(?i:esxi)"), "esxi",\
    match($os$, "(?i:f5)"), "f5",\
    match($os$, "(?i:asa)"), "asa",\
    true(), $os$\
))
iseval = 0

[normalize_os_family(1)]
args = os
definition = eval $os$=mvmap($os$, if(len(trim($os$)) = 0, $os$, case(\
    match($os$, "(?i:ios[ _-]?x[er]|(^|[^a-z])f5([^a-z]|$)|big-?ip|(^|[^a-z])asa([^a-z]|$)|junos|fortios|pan-?os|nx-?os|routeros|cisco)"), "Network device",\
    match($os$, "(?i:ipad)"), "iPadOS",\
    match($os$, "(?i:iphone|(^|[^a-z])ios([^a-z]|$))"), "iOS",\
    match($os$, "(?i:macos|mac ?os|os ?x|darwin|macbook|imac|catalina|big sur|monterey|ventura|sonoma|sequoia|tahoe|(^|[^a-z])mac([^a-z]|$))"), "Mac",\
    match($os$, "(?i:android)"), "Android",\
    match($os$, "(?i:windows[ _-]?server|win[ _-]?server|windows[ _-]?20[0-9]{2})"), "Windows Server",\
    match($os$, "(?i:windows|winxp|win ?(7|8|10|11))"), "Windows Desktop",\
    match($os$, "(?i:esxi|vmware|hyper-?v|proxmox|xenserver)"), "Hypervisor",\
    match($os$, "(?i:aix|solaris|hp-?ux|freebsd|openbsd|netbsd|unix)"), "Unix",\
    match($os$, "(?i:linux|ubuntu|debian|centos|red.?hat|rhel|suse|fedora|almalinux|rocky|kali|alpine)"), "Linux",\
    true(), "Other"\
)))
iseval = 0

# --- Merge search building blocks ---------------------------------------------------------------------
# The merge search (saved search assetdb-lookupgen, built by the Configure page) is made of what depends on your configuration (sources,
# fields, keys, filters) and of steps that are the same for every installation. The second kind live here, so the search reads as a
# short list of named steps. None of these definitions depends on the configuration: whatever varies is an argument.

# The counters each stage of the merge stamps on its rows; the run record and the preview read them.
[adb_counters]
definition = max(adb_total) as adb_total, max(adb_null_keys) as adb_null_keys, max(adb_large_keys) as adb_large_keys, max(adb_enrich_unmatched) as adb_enrich_unmatched, max(adb_enrich_ambiguous) as adb_enrich_ambiguous, max(adb_junk_keys) as adb_junk_keys, max(adb_junk_rows) as adb_junk_rows
iseval = 0

# `adb_map_column(field, lookup, column)`: for the rows that came from `lookup`, take the value of its column `column` as the asset field `field`
# (inside an eval). Write the column in quotes when its name has spaces or commas. Rows from other lookups keep their own value.
[adb_map_column(3)]
args = field, lookup, column
definition = $field$ = if(source_lookup="$lookup$", '$column$', $field$)
iseval = 0

# `adb_tag_time(field)`: prefix every value of a multivalue field with the zero padded time of its row (inside an eval), so that
# values() can de-duplicate without losing which value is the newest.
[adb_tag_time(1)]
args = field
definition = $field$ = mvmap($field$, printf("%015.3f", coalesce(_time, 0)) . "|" . $field$)
iseval = 0

# `adb_newest_first(field)`: the reverse of adb_tag_time (inside an eval): newest value first, de-duplicated, prefix removed.
[adb_newest_first(1)]
args = field
definition = $field$ = mvdedup(mvmap(mvreverse(mvsort($field$)), replace($field$, "^[^|]*[|]", "")))
iseval = 0

# `adb_key_blocklist(field)`: drop the placeholder and non-identifying values (all zero or all f MAC addresses, 0.0.0.0, localhost, unknown,
# none, loopback and link-local addresses, ...) from a match key (inside an eval). This is the default list; if you change the list under
# Settings > Key blocklist the generated search writes your list out instead. `_cs` compares exactly, the other ignores case.
[adb_key_blocklist(1)]
args = field
definition = $field$ = mvfilter(NOT (in(lower($field$), "00:00:00:00:00:00", "ff:ff:ff:ff:ff:ff", "0.0.0.0", "::", "::1", "localhost", "localhost.localdomain", "unknown", "none", "null", "n/a", "na", "undefined", "-") OR match(lower($field$), "^(00[:-]?){5}00$") OR match(lower($field$), "^(ff[:-]?){5}ff$") OR cidrmatch("127.0.0.0/8", $field$) OR cidrmatch("169.254.0.0/16", $field$)))
iseval = 0

[adb_key_blocklist_cs(1)]
args = field
definition = $field$ = mvfilter(NOT (in($field$, "00:00:00:00:00:00", "ff:ff:ff:ff:ff:ff", "0.0.0.0", "::", "::1", "localhost", "localhost.localdomain", "unknown", "none", "null", "n/a", "na", "undefined", "-") OR match($field$, "^(00[:-]?){5}00$") OR match($field$, "^(ff[:-]?){5}ff$") OR cidrmatch("127.0.0.0/8", $field$) OR cidrmatch("169.254.0.0/16", $field$)))
iseval = 0

# `adb_merge(max_keys, max_key_share)`: merge the rows that share any key. Only the keys go through the adbmerge command (every column
# would be serialized twice otherwise); its answer, one row per asset with its keys' rows, is joined back to the full rows by a row id.
# Clusters larger than max_keys come back marked adb_overflow=1 (they have no row of their own, so they get an id here). max_key_share=0
# turns the shared key check off. The join is a stats by row id, not an eventstats: eventstats keeps every event in memory and, past
# max_mem_usage_mb (200 MB by default), silently drops results (measured: 450,608 assets instead of 499,670 from 500,000 rows), while stats
# spills to disk.
[adb_merge(2)]
args = max_keys, max_key_share
definition = streamstats count as adb_rid | appendpipe [| fields adb_rid, _key, adb_auth | adbmerge max_keys=$max_keys$ max_key_share=$max_key_share$ overflow=emit] | streamstats count as adb_n | eval adb_rid=coalesce(adb_rid, "o" . adb_n) | stats values(*) as *, first(_time) as _time by adb_rid | where isnotnull(asset)
iseval = 0

# `adb_save_overflow`: write the clusters that were too large to merge to assetdb_overflow, for review (they never reach assetdb).
[adb_save_overflow]
definition = appendpipe [| where adb_overflow=1 | eval _key=md5(mvjoin(asset, "::")), run_time=now() | rename adb_cluster_keys as cluster_keys, adb_cluster_rows as cluster_rows | table _key asset cluster_keys cluster_rows source source_lookup run_time | outputlookup assetdb_overflow | where 1=0]
iseval = 0

# `adb_run_guard(min_ratio)`: compare the number of assets of this run with the last successful one. adb_guard=1 when it dropped below
# min_ratio of it. A marker row keeps the stream (and so the run record) alive when no asset is produced at all.
[adb_run_guard(1)]
args = min_ratio
definition = eventstats count as adb_assets_out | append [| makeresults | eval adb_is_marker=1 | table adb_is_marker] | append [| inputlookup assetdb_runs where status="ok" | sort 1 -run_time | eval adb_is_prev=1 | rename assets_out as adb_prev_out | table adb_is_prev adb_prev_out] | eventstats max(adb_prev_out) as adb_prev, max(adb_assets_out) as adb_assets_out | eval adb_guard = if(isnotnull(adb_prev) AND adb_assets_out < adb_prev * $min_ratio$, 1, 0)
iseval = 0

# `adb_record_run(min_ratio, runs_to_keep)`: add this run (counts, status ok, empty or blocked_low_count) to assetdb_runs, which keeps the
# last runs_to_keep runs.
[adb_record_run(2)]
args = min_ratio, runs_to_keep
definition = appendpipe [| stats max(adb_assets_out) as assets_out, max(adb_prev) as assets_prev, max(adb_guard) as guard, max(adb_total) as rows_in, max(adb_null_keys) as null_keys, max(adb_large_keys) as overflow_assets, max(adb_enrich_unmatched) as enrich_unmatched, max(adb_enrich_ambiguous) as enrich_ambiguous, max(adb_junk_keys) as junk_keys, max(adb_junk_rows) as junk_rows | eval run_time=now(), min_ratio=$min_ratio$, status=case(isnull(assets_out) OR assets_out=0, "empty", guard=1, "blocked_low_count", true(), "ok"), _key=run_time . "_" . substr(md5(tostring(random())), 1, 8) | fields - guard | inputlookup append=true assetdb_runs | sort $runs_to_keep$ -run_time | outputlookup assetdb_runs | where 1=0]
iseval = 0

# `adb_write_gate`: keep only the assets, and only when the run passed the safety check (no helper rows, no blocked run).
[adb_write_gate]
definition = where isnull(adb_is_marker) AND isnull(adb_is_prev) AND adb_guard=0
iseval = 0

# --- Enrichment: add the merged asset to any event ---------------------------------------------------
# Usage:  index=... | `adb_enrich(src_ip)`           adds asset_id, asset_source, asset_<field> ... for the asset that has
#                                                       that value as one of its keys (matching is lowercase)
#         ... | `adb_enrich_mac(src_mac)`             normalizes the value like the field normalizer before matching
#         ... | `adb_enrich_scoped(src_ip, site)`     for keys marked Scoped: looks up "<site>|<value>"
# The columns come from `adb_enrich_outputs`, which the Configure page keeps in line with the configured fields.

[adb_enrich_outputs]
definition = _key AS asset_id, source AS asset_source, source_lookup AS asset_source_lookup, last_seen AS asset_last_seen
iseval = 0

[adb_enrich_with(2)]
args = key,lookup
definition = eval adb_lookup_key=lower($key$) | lookup $lookup$ asset AS adb_lookup_key OUTPUTNEW `adb_enrich_outputs` | fields - adb_lookup_key
iseval = 0

[adb_enrich(1)]
args = key
definition = `adb_enrich_with($key$, assetdb)`
iseval = 0

[adb_enrich_scoped(2)]
args = key,scope
definition = eval adb_lookup_key=lower($scope$) . "|" . lower($key$) | lookup assetdb asset AS adb_lookup_key OUTPUTNEW `adb_enrich_outputs` | fields - adb_lookup_key
iseval = 0

[adb_enrich_mac(1)]
args = key
definition = eval adb_nk=$key$ | `normalize_mac(adb_nk)` | `adb_enrich_with(adb_nk, assetdb)` | fields - adb_nk
iseval = 0

[adb_enrich_ip(1)]
args = key
definition = eval adb_nk=$key$ | `normalize_ip(adb_nk)` | `adb_enrich_with(adb_nk, assetdb)` | fields - adb_nk
iseval = 0

[adb_enrich_host(1)]
args = key
definition = eval adb_nk=$key$ | `normalize_hostname(adb_nk)` | `adb_enrich_with(adb_nk, assetdb)` | fields - adb_nk
iseval = 0

# Asset Explorer. `adb_provenance` is rewritten by the Configure page from the configured sources and fields; the definition below is
# what a fresh install starts with.
#
# `adb_icon`: YOU write this one. It is an eval statement that sets the field adb_icon, which the Explorer draws as the icon next to
# each asset. Every asset has an icon: the value must be one of these, and anything else (or no value) gives the default, other:
#     server  desktop  laptop  mobile  tablet  network  printer  iot  virtual  storage  cloud  other
# It runs on the asset search, so any field of an asset can be used. Leave adb_icon unset (null) for no icon. Edit the definition under
# Settings > Advanced search > Search macros (the Configure page's Settings tab links there), or copy this stanza to local/macros.conf. Example:
#     eval adb_icon=case(match(mvjoin(category, " "), "(?i)printer"), "printer", match(mvjoin(os, " "), "(?i)windows server|linux"), "server", match(mvjoin(os, " "), "(?i)ios|android"), "mobile", true(), "other")
# (mvjoin makes a multivalue field safe to match on.)
[adb_icon]
definition = eval adb_icon="other"
iseval = 0

# `adb_provenance(<_key>)`: what each source holds for one asset, as rows of source, field, value, seen, adb_key. Values of a
# multivalue field are joined with ~|~. It reads the sources on demand, so use it for one asset at a time.
# `adb_prov_match(key, keys)`: what adb_provenance does to the rows of every source: the keys of the asset with this _key are looked up in
# the rows (the match fields `keys`, written like "dns, ip, mac") and only the rows that hold one of them stay. `adb_prov_end(name, seen, fields)`
# names the source, sets the time its values are shown with (an eval expression) and keeps the fields (written like "dns ip mac").
[adb_prov_match(2)]
args = key, keys
definition = eval adb_k=mvappend($keys$) | search [| inputlookup assetdb where _key="$key$" | fields asset | mvexpand asset | eval adb_k=asset | fields adb_k | format]
iseval = 0

[adb_prov_end(3)]
args = name, seen, fields
definition = eval adb_source="$name$", adb_seen=$seen$ | fields adb_source adb_seen $fields$
iseval = 0

[adb_provenance(1)]
args = key
definition = makeresults count=1 | where 1=0 | eval source=null(), field=null(), value=null(), seen=null(), adb_key=null() | fields - _time
iseval = 0
