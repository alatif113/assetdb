[assetdb]
external_type = kvstore
collection = assetdb
case_sensitive_match = false
max_matches = 1
fields_list = _key,asset,source,source_lookup,last_seen,scope,conflicts

[assetdb_demo_assets]
filename = assetdb_demo_assets.csv

[assetdb_runs]
external_type = kvstore
collection = assetdb_runs
fields_list = _key,run_time,status,assets_out,assets_prev,rows_in,null_keys,overflow_assets,enrich_unmatched,enrich_ambiguous,junk_keys,junk_rows,min_ratio

[assetdb_overflow]
external_type = kvstore
collection = assetdb_overflow
fields_list = _key,asset,cluster_keys,cluster_rows,source,source_lookup,run_time

[assetdb_changes]
external_type = kvstore
collection = assetdb_changes
fields_list = _key,run_time,change,asset_id,asset,changed_fields
