# Custom visualizations for Dashboard Studio (Splunk 10.4 or later). Sources are in viz/, built into
# appserver/static/visualizations/<name>/ by `npm run build:viz`. Used by the Explore dashboard.

[adb_heatmap]
label = AssetDB Heatmap
description = A heatmap for a table whose first column labels the rows and whose other columns are numbers from 0 to 100.
framework_type = studio_visualization

[adb_asset_explorer]
label = AssetDB Asset Explorer
description = Search assets, then see their fields and which source supplied each value.
framework_type = studio_visualization
